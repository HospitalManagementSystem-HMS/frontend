name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: HospitalManagementSystem-HMS/Hospital-Management/.github/workflows/frontend-templates.yaml@dev

    with:
      service: "frontend"
      image: "ghcr.io/HospitalManagementSystem-HMS/frontend"
      trigger: ${{ github.event_name }}

    secrets: inherit
